# Release 工作流：推送 v* 标签即自动构建并创建 GitHub Draft Release
# 用法：git tag v1.0.0 && git push origin v1.0.0
# 产物：SimpleViewer-v<标签>-win-x64.zip（.NET 自包含 + WinAppSDK 框架依赖，需目标机装一次 1.6 运行时）
# 说明：创建的是 Draft Release——到 GitHub Releases 页确认无误后手动点 Publish 发布。
#       CI 全新环境仍踩双 csproj 同目录还原踩踏（RULE 实锤），故用定向 restore + --no-restore
#       （tests 独立 obj 先还原，主工程定向还原放最后防覆盖）；XamlCompiler 间歇沉默崩溃以重试兜底。
#       WindowsAppSDKSelfContained=true 自包含布局有 XAML 资源解析缺陷（themeresources 定位失败），
#       与本地 release.ps1 同策略走框架依赖（2026-09-19）。

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 定向还原（tests → Core → 主工程 串行，防双 csproj 并行竞写 assets）
        shell: pwsh
        run: |
          dotnet restore tests/SimpleViewer.Tests/SimpleViewer.Tests.csproj --nologo -v:q
          dotnet msbuild SimpleViewer.Core.csproj -t:Restore -p:Platform=x64 -nr:false -nologo -v:q
          dotnet msbuild SimpleViewer.csproj -t:Restore -p:Platform=x64 -nr:false -nologo -v:q
          # 还原产物校验：assets 必须是主工程视角（含 WinAppSDK 包签名；缺则说明竞写又踩踏）
          if (-not (Select-String -Path obj/project.assets.json -Pattern 'Microsoft.WindowsAppSDK' -SimpleMatch -Quiet)) {
            Write-Error 'assets 非主工程视角（双 csproj 还原竞写）'
            exit 1
          }

      - name: 测试（Core 层 100 项）
        run: dotnet test tests/SimpleViewer.Tests/SimpleViewer.Tests.csproj --no-restore -nologo -v q

      - name: 发布（Release / win-x64 / 自包含，XamlCompiler 失败重试一次）
        shell: pwsh
        run: |
          $pub = @("SimpleViewer.csproj","-c","Release","-r","win-x64","--self-contained","true",
            "-p:Platform=x64","-o","release/publish","--no-restore","--nologo","-v:q")
          $ok = $false
          foreach ($i in 1..2) {
            dotnet publish @pub
            if ($LASTEXITCODE -eq 0 -and (Test-Path "release/publish/viewer.exe")) { $ok = $true; break }
            if ($i -lt 2) { Start-Sleep -Seconds 2 }
          }
          if (-not $ok) { exit 1 }
          # 散装资源补拷：publish 不带 .xbf/图标（unpackaged 按文件解析，缺失即启动崩——同 release.ps1）
          $binOut = "bin/x64/Release/net8.0-windows10.0.19041.0/win-x64"
          Copy-Item "$binOut/*.xbf" release/publish -Force
          Copy-Item "$binOut/Views" release/publish -Recurse -Force
          Copy-Item "$binOut/Assets" release/publish/Assets -Recurse -Force
          if (-not (Test-Path "release/publish/MainWindow.xbf")) { exit 1 }

      - name: 打包 zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path release/publish/* -DestinationPath "release/SimpleViewer-$tag-win-x64.zip"

      - name: 创建 Draft Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release/SimpleViewer-*-win-x64.zip
